<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particles</title>
  <style>
    :root {
      --fg: #f2f2f2;
      --fg-dim: #9a9a9a;
      --fg-faint: #5c5c5c;
      --panel: rgba(255, 255, 255, 0.05);
      --panel-border: rgba(255, 255, 255, 0.12);
      --panel-hover: rgba(255, 255, 255, 0.12);
      --ok: #d9d9d9;
      --warn: #8a8a8a;
      --bad: #4a4a4a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #000; color: var(--fg);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
    }
    canvas#scene { position: fixed; inset: 0; display: block; }

    .panel {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* Title (top-left) */
    #brand { top: 20px; left: 20px; padding: 12px 16px; }
    #brand h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; }
    #brand p { margin: 2px 0 0; color: var(--fg-dim); font-size: 11px; }

    /* Status + camera preview (top-right) */
    #status { top: 20px; right: 20px; width: 220px; padding: 10px; }
    #cam-wrap {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      border-radius: 8px; overflow: hidden; background: #0a0a0a;
    }
    #cam { width: 100%; height: 100%; object-fit: cover; display: none; }
    #cam-placeholder {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--fg-faint); font-size: 11px;
    }
    .rows { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11px; }
    .rows dt { color: var(--fg-dim); }
    .rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--bad); }
    .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .dot.warn { background: var(--warn); }
    .meter { height: 3px; margin-top: 8px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .meter > div { height: 100%; width: 0; background: var(--fg); transition: width 0.1s linear; }

    /* Control bar (bottom-center) */
    #controls {
      bottom: 22px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; padding: 6px;
      max-width: calc(100vw - 32px); overflow-x: auto;
    }
    .sep { width: 1px; height: 22px; background: var(--panel-border); margin: 0 4px; flex: none; }
    button, label.btn {
      flex: none; appearance: none; border: 1px solid transparent; background: transparent;
      color: var(--fg-dim); font: inherit; padding: 8px 14px; border-radius: 9px; cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    button:hover, label.btn:hover { background: var(--panel-hover); color: var(--fg); }
    button.active { color: #000; background: var(--fg); }
    button:focus-visible { outline: 1px solid var(--fg); }
    input[type="color"] {
      width: 22px; height: 22px; padding: 0; border: 1px solid var(--panel-border);
      border-radius: 50%; background: none; cursor: pointer; overflow: hidden;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }

    /* Breathing guide text (center) */
    #breath {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      pointer-events: none; text-align: center; opacity: 0; transition: opacity 1.2s ease;
    }
    #breath.on { opacity: 1; }
    #breath-word { font-size: 26px; font-weight: 300; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.55); transition: opacity 0.6s ease; }
    #breath-count { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 0.3em; }

    /* Hint (bottom-left) */
    #hint { position: fixed; left: 22px; bottom: 26px; color: var(--fg-faint); font-size: 11px; line-height: 1.6; pointer-events: none; }

    @media (max-width: 720px) {
      #status { width: 150px; }
      #hint { display: none; }
      #brand p { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="brand" class="panel">
    <h1>Particles</h1>
    <p>Gesture-driven calm</p>
  </div>

  <div id="status" class="panel" aria-live="polite">
    <div id="cam-wrap">
      <img id="cam" alt="Camera preview with hand skeleton" />
      <div id="cam-placeholder">No camera feed</div>
    </div>
    <dl class="rows">
      <dt>Connection</dt><dd><span id="ws-dot" class="dot"></span><span id="ws-state">Connecting</span></dd>
      <dt>Backend</dt><dd id="backend">—</dd>
      <dt>Render</dt><dd id="fps-render">— fps</dd>
      <dt>Inference</dt><dd id="fps-infer">—</dd>
      <dt>Hands</dt><dd id="hands">0</dd>
    </dl>
    <div class="meter" title="Hand openness"><div id="open-meter"></div></div>
  </div>

  <div id="breath" aria-hidden="true">
    <div id="breath-word">Inhale</div>
    <div id="breath-count"></div>
  </div>

  <div id="hint">
    Open hands — expand<br />
    Make a fist — gather<br />
    Keys: 1–4 shapes · B breathe · F fullscreen
  </div>

  <div id="controls" class="panel" role="toolbar" aria-label="Controls">
    <button data-template="heart" class="active">Heart</button>
    <button data-template="flower">Flower</button>
    <button data-template="saturn">Saturn</button>
    <button data-template="fireworks">Fireworks</button>
    <span class="sep"></span>
    <label class="btn" title="Particle color">
      <input id="color" type="color" value="#ff8fb1" aria-label="Particle color" />
    </label>
    <button id="breath-toggle" aria-pressed="false">Breathe</button>
    <button id="fullscreen" title="Fullscreen">Fullscreen</button>
  </div>

  <!-- Three.js from CDN via an import map: no build step required. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
